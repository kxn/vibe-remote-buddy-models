name: Validate catalog
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python tools/validate.py
      - name: Preserve existing resource revisions
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changes=$(git diff --name-only --diff-filter=MD "$BASE_SHA" HEAD -- voices/ keys/ fingerprints/ models/)
          if [ -n "$changes" ]; then
            echo "Add a new resource revision instead of changing/removing an existing one:"
            echo "$changes"
            exit 1
          fi
